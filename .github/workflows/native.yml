name: Native services

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B build/native -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/native --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure
